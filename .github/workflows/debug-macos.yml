name: debug-macos-sigsegv
on:
  push:
    branches: [ci-debug/macos-sigsegv]
  workflow_dispatch:

jobs:
  stress:
    name: stress (${{ matrix.runner }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
        variant: [original, rare-clock]
    steps:
      - uses: actions/checkout@v4
      - name: env
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl -n sysctl.proc_translated 2>/dev/null || true
          rustup target add x86_64-apple-darwin
          rustc -V
      - name: patch test (rare-clock)
        if: matrix.variant == 'rare-clock'
        run: |
          python3 - <<'PY'
          p = "src/profiler.rs"; s = open(p).read()
          old = """        while start.elapsed().as_millis() < 500 {
                      std::hint::black_box(());
                  }"""
          new = """        let mut n: u64 = 0;
                  loop {
                      n = std::hint::black_box(n + 1);
                      if n % 10_000_000 == 0 && start.elapsed().as_millis() >= 500 {
                          break;
                      }
                  }"""
          assert old in s, "pattern not found"
          open(p, "w").write(s.replace(old, new))
          PY
          git diff
      - name: build test binary (x86_64, default backtrace-rs unwinder)
        run: |
          BIN=$(cargo test --lib --features flamegraph,prost-codec --target x86_64-apple-darwin --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .target.kind[0]=="lib") | .executable')
          echo "BIN=$BIN" >> $GITHUB_ENV
          file "$BIN"
      - name: stress single test (40 runs)
        run: |
          set +e
          fail=0
          for i in $(seq 1 40); do
            "$BIN" profiler::tests::test_no_alloc_during_unwind --exact --test-threads 1 > out.txt 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then fail=$((fail+1)); echo "run $i: rc=$rc"; fi
          done
          echo "RESULT ${{ matrix.runner }} ${{ matrix.variant }} SINGLE_TEST_FAILURES=$fail/40" | tee -a $GITHUB_STEP_SUMMARY
      - name: symbolize libunwind fault offset
        if: matrix.runner == 'macos-26' && matrix.variant == 'original'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*pprof*.ips; do
            python3 -c "
          import json,sys
          t=open(sys.argv[1]).read(); h,b=t.split('\n',1); b=json.loads(b)
          ts=b['threads'][b['faultingThread']]['threadState']; rip=ts['rip']['value']
          for im in b['usedImages']:
              if im.get('base',0)<=rip<im.get('base',0)+im.get('size',0): print(im.get('name'), hex(rip), hex(rip-im['base']), hex(im['base']))
          " "$f"; break
          done
          lldb --batch -o "target create --arch x86_64 /usr/lib/system/libunwind.dylib" -o "image lookup -v -a 0x35d4" -o "disassemble -s 0x35a0 -c 24" || true
      - name: collect crash reports
        if: always()
        run: |
          mkdir -p reports
          cp ~/Library/Logs/DiagnosticReports/*pprof* reports/ 2>/dev/null || true
          ls reports | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-${{ matrix.runner }}-${{ matrix.variant }}
          path: reports/
          if-no-files-found: ignore
